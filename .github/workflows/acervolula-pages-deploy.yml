name: Publicar Acervo Lula

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar a fonte única
        uses: actions/checkout@v4
        with:
          repository: rennanmetsi-gif/data2commsfinal
          ref: main

      - name: Definir o domínio deste deploy
        run: printf 'acervolula.com.br\n' > CNAME

      - name: Definir página inicial exclusiva do Acervo Lula
        run: |
          cat > index.html <<'EOF'
          ---
          layout: null
          permalink: /
          sitemap: false
          ---
          {% include links-page.html %}
          EOF

      - name: Preparar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Compilar Jekyll
        run: bundle exec jekyll build

      - name: Ajustar SEO exclusivo do novo domínio
        shell: bash
        run: |
          cat > _site/robots.txt <<'EOF'
          # Leitores de prévia de links do Instagram, Facebook, Messenger e WhatsApp
          User-agent: facebookexternalhit
          Allow: /

          User-agent: Facebot
          Allow: /

          User-agent: meta-externalagent
          Allow: /

          User-agent: Meta-ExternalFetcher
          Allow: /

          User-agent: *
          Allow: /
          Disallow: /admin/
          Sitemap: https://acervolula.com.br/sitemap.xml
          EOF
          cat > _site/sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://acervolula.com.br/</loc></url>
          </urlset>
          EOF
          find _site -type f -name '*.html' ! -path '_site/index.html' -print0 |
            while IFS= read -r -d '' file; do
              sed -i '0,/<head>/s//<head><meta name="robots" content="noindex,follow">/' "$file"
            done

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
